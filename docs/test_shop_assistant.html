<!DOCTYPE html>
<html>
    <head>
        <title>ViSenze Widget Tester</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                margin: 0;
                padding: 20px;
            }
            .config-panel {
                background: #f5f5f5;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
                max-width: 600px;
            }
            .config-panel h2 {
                margin-top: 0;
                color: #333;
            }
            .config-row {
                display: flex;
                align-items: center;
                margin-bottom: 12px;
            }
            .config-row label {
                width: 120px;
                font-weight: 500;
                color: #555;
            }
            .config-row input[type="text"],
            .config-row select {
                flex: 1;
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
            }
            .config-row input[type="checkbox"] {
                width: 18px;
                height: 18px;
                cursor: pointer;
            }
            .toggle-label {
                margin-left: 8px;
                color: #666;
            }
            .load-btn {
                background: #007bff;
                color: white;
                border: none;
                padding: 10px 24px;
                border-radius: 4px;
                font-size: 14px;
                cursor: pointer;
                margin-top: 8px;
            }
            .load-btn:hover {
                background: #0056b3;
            }
            #widget-container {
                min-height: 400px;
            }
        </style>
    </head>
    <body>
        <div class="config-panel">
            <h2>Widget Configuration</h2>
            <div class="config-row">
                <label for="widget-id">Placement ID:</label>
                <input type="text" id="widget-id" value="">
            </div>
            <div class="config-row">
                <label for="app-key">App Key:</label>
                <input type="text" id="app-key" value="">
            </div>
            <div class="config-row">
                <label for="environment">Environment:</label>
                <select id="environment">
                    <option value="staging">Staging (search-dev.visenze.com)</option>
                    <option value="production" selected>Production (multimodal.search.rezolve.com)</option>
                </select>
            </div>
            <div class="config-row">
                <label for="chat-agent">Chat Agent:</label>
                <input type="text" id="chat-agent" value="shopping_assistant_v2">
            </div>
            <div class="config-row">
                <label for="disable-cache">Cache:</label>
                <input type="checkbox" id="disable-cache" checked>
                <span class="toggle-label">Disable cache</span>
            </div>
            <button class="load-btn" onclick="loadWidget()">Load Widget</button>
        </div>

        <div id="widget-container"></div>

        <script type="text/javascript">
            function loadWidget() {
                const widgetId = document.getElementById('widget-id').value.trim();
                const appKey = document.getElementById('app-key').value.trim();
                const environment = document.getElementById('environment').value;
                const chatAgent = document.getElementById('chat-agent').value.trim();
                const disableCache = document.getElementById('disable-cache').checked;

                if (!widgetId || !appKey) {
                    alert('Please enter both Placement ID and App Key');
                    return;
                }

                const domain = environment === 'production' ? 'multimodal.search.rezolve.com' : 'search-dev.visenze.com';

                // Clear previous widget
                const container = document.getElementById('widget-container');
                container.innerHTML = `<div class="ps-widget-${widgetId}"></div>`;

                // Remove previous widget scripts
                document.querySelectorAll('script[data-visenze-widget]').forEach(s => s.remove());

                // Set up config
                window.visenzeConfigs = window.visenzeConfigs || {};
                window.visenzeConfigs[widgetId] = {
                    searchSettings: {
                        disable_cache: disableCache,
                    },
                };

                if (chatAgent) {
                    window.visenzeConfigs[widgetId].customizations = {
                        chatbot: {
                            chatAgent: chatAgent,
                        },
                    };
                }

                // Load widget
                const uid = localStorage.getItem("va-uid") || (function() {
                    let time = new Date().getTime();
                    let uuid = "xxxxxxxx.xxxx.4xxx.yxxx.xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
                        let r = (time + 16 * Math.random()) % 16 | 0;
                        time = Math.floor(time / 16);
                        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
                    });
                    localStorage.setItem("va-uid", uuid);
                    return uuid;
                })();

                const script = document.createElement('script');
                script.async = true;
                script.setAttribute('data-visenze-widget', 'true');
                script.src = `https://${domain}/v2/widget-init?app_key=${appKey}&placement_id=${widgetId}&container=.ps-widget-${widgetId}&uid=${uid}`;
                document.body.appendChild(script);
            }

            // Load widget on page load
            window.onload = loadWidget;
        </script>
    </body>
</html>
