<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Prompt Box</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f5f5f5; font-family: sans-serif; }
    .page { max-width: 420px; margin-left: auto; }
  </style>
</head>
<body>
  <div class="page">
    <!-- Set data-pid to a product id from your catalog (optional: leave it empty for no product context) -->
    <div class="ai-prompt-box-widget" data-pid="10625003"></div>
  </div>
</body>
</html>
